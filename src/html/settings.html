<!-- Schermata Impostazioni -->
<div id="settings-modal" class="hide" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <h2 id="settings-title" class="menu-title">Impostazioni</h2>
    <div class="settings-content">
        <div class="volume-control">
            <label for="sfx-volume"><span class="sr-only">Volume </span>Effetti Sonori</label>
            <input type="range" id="sfx-volume" min="0" max="10" step="1" value="9">
        </div>
        <div class="volume-control">
            <label for="music-volume"><span class="sr-only">Volume </span>Musica</label>
            <input type="range" id="music-volume" min="0" max="10" step="1" value="1">
        </div>
    </div>
    <button type="button" id="close-settings-btn" class="arcade-btn">Chiudi</button>
</div>
